<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://js.puter.com/v2/"></script><style>body{font-family:system-ui;background:#07111d;color:#eaf2ff;padding:18px}button{padding:12px 16px;border:0;border-radius:10px;background:#1769e0;color:#fff;font-weight:700;margin:4px}.card{background:#0e1a29;border:1px solid #26364d;border-radius:14px;padding:14px;margin:12px 0}.muted{color:#9fb0c8;white-space:pre-wrap}.ok{color:#35d39a}.bad{color:#ff737f}</style></head><body><h2>🤖 Puter.js AI Validation</h2><p class=muted>Deterministic engine first. Puter explains/validates; it cannot invent a trade.</p><button id=login>Sign in with Puter</button><button id=run style="display:none">Validate current market</button><div id=out></div><script>const out=document.getElementById('out'),login=document.getElementById('login'),run=document.getElementById('run');const backend=new URLSearchParams(location.search).get('backend')||location.origin;async function auth(){try{if(!puter.auth.isSignedIn())await puter.auth.signIn();login.style.display='none';run.style.display='inline-block';out.innerHTML='<div class=card>Signed in with Puter</div>'}catch(e){out.innerHTML='<div class="card bad">'+String(e)+'</div>'}}async function validate(){out.innerHTML='<div class=card>Loading market evidence…</div>';try{const d=await (await fetch(backend.replace(/\/$/,'')+'/v1/signal/validate?symbol=NIFTY')).json();const prompt='Validate this deterministic NSE options result. Do not invent data. Explain CALL/PUT/WAIT, support, resistance, OI/PCR and risk/reward. If evidence conflicts or data is stale, prefer WAIT/NO TRADE. Never promise profit. DATA='+JSON.stringify(d);const r=await puter.ai.chat(prompt,{model:'gpt-5.6-luna',temperature:.1,normalize:true});const t=r?.message?.content||r?.content||JSON.stringify(r);out.innerHTML='<div class=card><b>ENGINE:</b> <span class='+(d.decision==='CALL BUY'?'ok':d.decision==='PUT BUY'?'bad':'muted')+'>'+d.decision+'</span><pre class=muted>'+JSON.stringify(d,null,2)+'</pre></div><div class=card><b>PUTER VALIDATION</b><pre class=muted>'+String(t)+'</pre></div>'}catch(e){out.innerHTML='<div class="card bad">'+String(e)+'</div>'}}login.onclick=auth;run.onclick=validate;if(puter.auth.isSignedIn())auth();</script></body></html>
