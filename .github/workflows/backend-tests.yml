name: Backend Python Tests
on:
  push:
    paths:
      - "backend/**"
      - "tests/**"
      - "requirements.txt"
  pull_request:
    paths:
      - "backend/**"
      - "tests/**"
      - "requirements.txt"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest -q
