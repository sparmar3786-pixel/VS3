name: VS3 Flutter APK
on:
  workflow_dispatch:
  pull_request:
  push:
    paths:
      - "flutter_app/**"
      - ".github/workflows/flutter-apk.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true
      - name: Create Android shell
        run: flutter create --org com.vs3 --project-name vs3_terminal --platforms android .flutter_build
      - name: Install VS3 Flutter source
        run: |
          cp flutter_app/pubspec.yaml .flutter_build/pubspec.yaml
          rm -rf .flutter_build/lib .flutter_build/test
          cp -r flutter_app/lib .flutter_build/lib
          cp -r flutter_app/test .flutter_build/test
          sed -i 's/ndkVersion = flutter.ndkVersion/ndkVersion = "26.3.11579264"/' .flutter_build/android/app/build.gradle.kts
      - name: Dependencies
        working-directory: .flutter_build
        run: flutter pub get
      - name: Dart analyze
        working-directory: .flutter_build
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Flutter tests
        working-directory: .flutter_build
        run: flutter test
      - name: Build release APK
        working-directory: .flutter_build
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: vs3-flutter-release-apk
          path: .flutter_build/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 90
