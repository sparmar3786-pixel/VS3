<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuantDesk Terminal</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{--bg:#050505;--panel:#0d0d0d;--line:#2a2113;--amber:#ff9f1a;--txt:#e8e0d0;--dim:#8a7d65;--up:#26d07c;--dn:#ff4d4d}
*{box-sizing:border-box;margin:0}body{background:radial-gradient(1200px 600px at 70% -10%,#1b1307 0%,var(--bg) 60%);color:var(--txt);font:12px/1.4 "SF Mono",Menlo,Consolas,monospace;height:100vh;overflow:hidden;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:18px;padding:8px 14px;border-bottom:1px solid var(--line);background:#0a0a0a}.logo{color:var(--amber);font-weight:700;letter-spacing:2px}.kpi b{display:block;font-size:14px}.kpi span{color:var(--dim);font-size:10px;text-transform:uppercase}.up{color:var(--up)}.dn{color:var(--dn)}.grow{flex:1}
button{background:#1a1408;color:var(--amber);border:1px solid var(--amber);padding:5px 10px;cursor:pointer;font:inherit}button.kill{background:#2a0a0a;color:var(--dn);border-color:var(--dn)}
main{flex:1;display:grid;grid-template-columns:200px 1fr 320px;grid-template-rows:1fr 220px;gap:6px;padding:6px;min-height:0}.panel{background:var(--panel);border:1px solid var(--line);overflow:auto;min-height:0}.panel h3{position:sticky;top:0;background:#120d05;color:var(--amber);font-size:10px;letter-spacing:2px;padding:5px 8px;border-bottom:1px solid var(--line)}
#watch .row{display:flex;justify-content:space-between;padding:7px 8px;cursor:pointer;border-bottom:1px solid #15110a}#watch .row.sel{background:#1f1608;border-left:2px solid var(--amber)}
#chartwrap{grid-row:1;grid-column:2;display:flex;flex-direction:column}#chart{flex:1;min-height:0}#right{grid-row:1/3;grid-column:3;display:flex;flex-direction:column;gap:6px;min-height:0}#bottom{grid-column:1/3;display:grid;grid-template-columns:1fr 1fr;gap:6px;min-height:0}
table{width:100%;border-collapse:collapse}th,td{text-align:right;padding:4px 8px;border-bottom:1px solid #15110a}th:first-child,td:first-child{text-align:left}th{color:var(--dim);font-weight:400}.layer{display:flex;align-items:center;gap:8px;padding:5px 8px;border-bottom:1px solid #15110a}.dot{width:8px;height:8px;border-radius:50%;background:var(--up);box-shadow:0 0 8px var(--up)}.bar{height:6px;background:#1a1a1a;position:relative;flex:1}.bar i{position:absolute;top:0;bottom:0}.tag{padding:1px 6px;border:1px solid var(--amber);color:var(--amber)}.sw{display:flex;justify-content:space-between;padding:4px 8px;border-bottom:1px solid #15110a}
@media(max-width:900px){main{grid-template-columns:1fr;grid-template-rows:auto 320px auto auto;overflow:auto}#right,#bottom,#chartwrap{grid-column:1;grid-row:auto}body{overflow:auto}}
</style>
</head>
<body>
<header><div class="logo">QUANTDESK ▸ TERMINAL</div><div class="kpi"><span>Equity</span><b id="eq">—</b></div><div class="kpi"><span>P&amp;L</span><b id="pnl">—</b></div><div class="kpi"><span>Realized</span><b id="real">—</b></div><div class="kpi"><span>Mode</span><b style="color:var(--amber)">PAPER</b></div><div class="kpi"><span>Status</span><b id="status">LIVE</b></div><div class="grow"></div><button onclick="api('/api/resume')">RESUME</button><button class="kill" onclick="api('/api/kill')">KILL SWITCH</button></header>
<main><div class="panel" id="watch"><h3>WATCHLIST</h3><div id="wl"></div></div><div class="panel" id="chartwrap"><h3 id="ctitle">CHART</h3><div id="chart"></div></div><div id="right"><div class="panel"><h3>6-LAYER AI · ACTIVE</h3><div id="layers"></div></div><div class="panel"><h3>SIGNAL · <span id="sigsym"></span></h3><div id="signal"></div></div><div class="panel"><h3>STRATEGIES</h3><div id="strats"></div></div></div><div id="bottom"><div class="panel"><h3>POSITIONS</h3><table><thead><tr><th>Sym</th><th>Qty</th><th>Avg</th><th>Last</th><th>P&amp;L</th></tr></thead><tbody id="pos"></tbody></table></div><div class="panel"><h3>ORDERS</h3><table><thead><tr><th>Sym</th><th>Side</th><th>Qty</th><th>Price</th><th>Why</th></tr></thead><tbody id="ord"></tbody></table></div></div></main>
<script>
const LAYERS=["Data Guard","Regime Detector","Strategy Ensemble","Online ML","Risk Guard","Supervisor"],$=id=>document.getElementById(id),fmt=n=>Number(n).toLocaleString("en-IN",{maximumFractionDigits:2}),cls=n=>n>=0?"up":"dn";
let sel=null,symbols=[],data={},last={},state={};
const chart=LightweightCharts.createChart($("chart"),{layout:{background:{color:"#0d0d0d"},textColor:"#8a7d65"},grid:{vertLines:{color:"#15110a"},horzLines:{color:"#15110a"}},timeScale:{timeVisible:true,secondsVisible:true,borderColor:"#2a2113"},rightPriceScale:{borderColor:"#2a2113"},crosshair:{mode:0}});
const candles=chart.addCandlestickSeries({upColor:"#26d07c",downColor:"#ff4d4d",borderVisible:false,wickUpColor:"#26d07c",wickDownColor:"#ff4d4d"}),emaLine=chart.addLineSeries({color:"#ff9f1a",lineWidth:1,priceLineVisible:false});
new ResizeObserver(()=>chart.applyOptions({width:$("chart").clientWidth,height:$("chart").clientHeight})).observe($("chart"));
function ema(arr,n){const a=2/(n+1);let e=arr[0].close;return arr.map(c=>({time:c.time,value:e=a*c.close+(1-a)*e}));}
function draw(){if(!sel)return;const d=data[sel]||[];candles.setData(d);emaLine.setData(d.length?ema(d,21):[]);markers();$("ctitle").textContent=sel+" · "+(last[sel]?fmt(last[sel]):"")}
function markers(){const m=(state.orders||[]).filter(o=>o.symbol===sel).map(o=>({time:Math.floor(o.time/5)*5,position:o.side==="BUY"?"belowBar":"aboveBar",color:o.side==="BUY"?"#26d07c":"#ff4d4d",shape:o.side==="BUY"?"arrowUp":"arrowDown",text:o.side})).reverse();try{candles.setMarkers(m)}catch(e){}}
function renderWatch(){$("wl").innerHTML=symbols.map(s=>`<div class="row ${s===sel?"sel":""}" onclick="pick('${s}')"><span>${s}</span><span>${last[s]?fmt(last[s]):"—"}</span></div>`).join("")}
function pick(s){sel=s;renderWatch();draw();renderSignal()}
function renderState(){const p=state.portfolio;if(!p)return;$("eq").textContent=fmt(p.equity);$("pnl").textContent=fmt(p.pnl);$("pnl").className=cls(p.pnl);$("real").textContent=fmt(p.realized);$("real").className=cls(p.realized);$("status").textContent=p.kill?"KILLED":p.halted?"HALTED":"LIVE";$("status").className=(p.kill||p.halted)?"dn":"up";
$("layers").innerHTML=LAYERS.map((n,i)=>{const l=state.layers[i+1]||{};return `<div class="layer"><span class="dot"></span><span style="flex:1">L${i+1} ${n}</span><span style="color:var(--dim)">${l.last_ms??0}ms · ${l.processed??0}</span></div>`}).join("");
$("strats").innerHTML=Object.entries(state.strategies).map(([k,v])=>`<div class="sw"><span>${k}</span><label><input type="checkbox" ${v?"checked":""} onchange="api('/api/strategy/'+encodeURIComponent('${k}')+'?enabled='+this.checked)"></label></div>`).join("");
$("pos").innerHTML=(state.positions||[]).map(x=>{const pl=(x.last-x.avg)*x.qty;return `<tr><td>${x.symbol}</td><td>${x.qty}</td><td>${fmt(x.avg)}</td><td>${fmt(x.last)}</td><td class="${cls(pl)}">${fmt(pl)}</td></tr>`}).join("");
$("ord").innerHTML=(state.orders||[]).map(o=>`<tr><td>${o.symbol}</td><td class="${o.side==="BUY"?"up":"dn"}">${o.side}</td><td>${o.qty}</td><td>${fmt(o.price)}</td><td style="color:var(--dim)">${o.reason}</td></tr>`).join("");renderSignal();markers()}
function renderSignal(){$("sigsym").textContent=sel||"";const s=(state.signals||{})[sel];if(!s){$("signal").innerHTML='<div class="sw"><span>Warming up…</span></div>';return}const v=Object.entries(s.votes).map(([k,x])=>`<div class="layer"><span style="width:110px">${k}</span><div class="bar"><i style="left:${x<0?50+x*50:50}%;width:${Math.abs(x)*50}%;background:${x>=0?"var(--up)":"var(--dn)"}"></i></div><span style="width:44px;text-align:right">${x.toFixed(2)}</span></div>`).join("");$("signal").innerHTML=`<div class="sw"><span>Regime</span><span class="tag">${s.regime}</span></div><div class="sw"><span>Ensemble / ML P(up)</span><span>${s.score} / ${s.p_up}</span></div><div class="sw"><span>Confidence · Data quality</span><span>${s.confidence} · ${s.quality}</span></div><div class="sw"><span>Decision</span><b class="${s.action==="BUY"?"up":s.action==="SELL"?"dn":""}">${s.action}</b></div><div class="sw"><span style="color:var(--dim)">${s.why}</span></div>${v}`}
async function api(u){await fetch(u,{method:"POST"})}
function connect(){const ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host+"/ws");ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==="snapshot"){symbols=m.symbols;data=m.candles;state=m;Object.assign(last,m.prices);if(!sel)sel=symbols[0];renderWatch();draw();renderState()}else if(m.type==="tick"){last[m.symbol]=m.candle.close;const d=data[m.symbol]||(data[m.symbol]=[]),l=d[d.length-1];if(l&&l.time===m.candle.time)d[d.length-1]=m.candle;else{d.push(m.candle);if(d.length>600)d.shift()}if(m.symbol===sel){candles.update(m.candle);const e=ema(d,21);emaLine.update(e[e.length-1]);$("ctitle").textContent=sel+" · "+fmt(m.candle.close)}renderWatch()}else if(m.type==="state"){state=m;renderState()}};ws.onclose=()=>setTimeout(connect,1500)}connect();
</script>
</body>
</html>
