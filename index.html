<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NSE-AI-TERMINAL</title>
<style>
:root{--bg:#050505;--panel:#0c0c0c;--panel2:#111;--line:#292929;--text:#e4e4e4;--muted:#818181;--amber:#ff9f1a;--green:#2ee66b;--red:#ff4d4d;--blue:#4da6ff;--cyan:#22d3ee;--purple:#b784ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -20%,#211507 0,#050505 36%);color:var(--text);font:12px/1.35 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
button,input{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:30;background:linear-gradient(90deg,#ffb52b,#ff9412);color:#080808;padding:8px 10px;display:flex;align-items:center;gap:9px;font-weight:800;box-shadow:0 3px 18px #0008}.top b{font-size:15px}.menu{border:0;background:#080808;color:var(--amber);padding:4px 9px}.theme{margin-left:auto;border:1px solid #111;background:#111;color:var(--amber);padding:4px 8px}.cmd{display:flex;gap:7px;align-items:center;padding:7px 10px;background:#0a0a0a;border-bottom:1px solid var(--line)}.cmd input{min-width:0;flex:1;border:1px solid var(--amber);background:#030303;color:var(--amber);padding:7px 9px;outline:none}.ticker{display:flex;gap:22px;overflow:auto;white-space:nowrap;padding:6px 10px;background:#080808;border-bottom:1px solid var(--line)}.ticker span{color:var(--muted)}.ticker strong{color:var(--text)}.tabs{display:flex;gap:3px;overflow:auto;padding:5px 7px 0;background:#090909;border-bottom:1px solid var(--amber)}.tabs button{flex:none;border:0;border-top:3px solid var(--line);background:#181818;color:#aaa;padding:6px 10px}.tabs button.active{border-top-color:var(--amber);background:var(--amber);color:#080808;font-weight:800}main{padding:7px;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:7px}.card{grid-column:span 12;background:linear-gradient(180deg,#101010,#0b0b0b);border:1px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:0 5px 18px #0006}.card h2{margin:0;padding:6px 9px;font-size:11px;color:var(--amber);background:#161616;border-left:4px solid var(--amber);letter-spacing:.25px}.body{padding:9px}.c4{grid-column:span 4}.c6{grid-column:span 6}.c8{grid-column:span 8}@media(max-width:850px){.c4,.c6,.c8{grid-column:span 12}}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}.metric{padding:8px;border:1px solid var(--line);background:#0a0a0a;border-radius:6px}.metric small{display:block;color:var(--muted);margin-bottom:3px}.metric strong{font-size:15px}.row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dotted #272727}.up{color:var(--green)}.dn{color:var(--red)}.am{color:var(--amber)}.mu{color:var(--muted)}.sig{font-size:27px;font-weight:900;margin:5px 0 7px}.meter{height:7px;background:#272727;border-radius:8px;overflow:hidden;margin:5px 0 9px}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--amber),var(--green))}table{width:100%;border-collapse:collapse;white-space:nowrap}th{color:var(--muted);font-weight:500;text-align:right;padding:5px 6px;border-bottom:1px solid var(--line)}td{text-align:right;padding:5px 6px;border-bottom:1px solid #171717}th:first-child,td:first-child{text-align:left}tr.atm td{background:#ff9f1a18;color:var(--amber);font-weight:800}.pill{display:inline-block;padding:2px 7px;border-radius:4px;font-weight:800;background:var(--green);color:#000}.pill.red{background:var(--red)}.pill.amber{background:var(--amber)}.chart{height:155px;width:100%;display:block;background:linear-gradient(#111,#090909);border-radius:5px}.bars{display:flex;align-items:end;height:125px;gap:4px;padding:8px 2px}.bars i{flex:1;min-width:4px;border-radius:2px 2px 0 0;background:var(--green)}.bars i:nth-child(3n){background:var(--red)}.drawer{position:fixed;z-index:50;left:0;top:0;bottom:0;width:min(360px,90vw);background:#0b0b0b;border-right:2px solid var(--amber);padding:12px;overflow:auto;transform:translateX(-102%);transition:.2s;box-shadow:10px 0 35px #000b}.drawer.open{transform:none}.overlay{position:fixed;z-index:49;inset:0;background:#0009;display:none}.overlay.open{display:block}.dg{display:flex;flex-direction:column;gap:5px}.dg button{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-left:4px solid #3a3a3a;border-radius:5px;background:#060606;color:#ddd;padding:9px 8px;text-align:left;transition:.15s}.dg button:hover{border-left-color:var(--amber);background:#151515}.dg button.active{background:var(--amber);border-left-color:#fff;color:#000;font-weight:900}.num{width:24px;opacity:.7}.drawerSub{color:var(--muted);font-size:10px;margin:-5px 0 10px}.drawerHead{display:flex;justify-content:space-between;align-items:center;color:var(--amber);font-weight:800;margin-bottom:10px}.close{border:1px solid var(--line);background:#111;color:#ddd;padding:3px 8px}footer{padding:9px 10px;color:var(--muted);border-top:1px solid var(--line)}
</style>
</head>
<body>
<header class="top"><button class="menu" id="menu">☰</button><b>NSE-AI-TERMINAL</b><span>Smart Analysis · Disciplined Execution</span><span id="clock"></span><button class="theme" id="theme">LIGHT/DARK</button></header>
<div class="cmd"><b class="am">CMD&gt;</b><input id="cmd" placeholder="NIFTY / BANKNIFTY / SENSEX / tab 1-30"><span class="mu">PAPER</span></div>
<div class="ticker" id="ticker"></div><div class="overlay" id="overlay"></div><aside class="drawer" id="drawer"></aside><nav class="tabs" id="tabs"></nav><main id="app"></main>
<footer>Research terminal · Live architecture: Angel One SmartAPI → FastAPI → WebSocket. Live order placement remains OFF.</footer>
<script>
const I={NIFTY:['NIFTY 50',24689.75,50],BANKNIFTY:['BANK NIFTY',52317.2,100],FINNIFTY:['FINNIFTY',23482.1,50],SENSEX:['SENSEX',81742.2,100],MIDCPNIFTY:['MIDCPNIFTY',12345.6,25],BANKEX:['BANKEX',60210,15]};
const tabs=['Splash','Login','Dashboard','Market','Option Chain','OI Heatmap','Premium/Vol','Greeks/IV','Order Flow','Regime','Trade Plans','Backtest','Strategies','AI 6-Layer','Logs/Settings','Portfolio','Charts','Strategy Detail','Risk','Alerts','Help','Watchlist','Orders','Signal History','Scanner','FII/DII','News','Alert Rules','Journal','Broker/API'];
let cur='NIFTY',active=2,logs=['Terminal ready · PAPER mode · live orders OFF'];
const fmt=n=>Number(n).toLocaleString('en-IN',{maximumFractionDigits:2});
const sec=(t,b,c='')=>'<section class="card '+c+'"><h2>'+t+'</h2><div class="body">'+b+'</div></section>';
const rows=a=>'<table>'+a.map((r,i)=>'<tr>'+r.map(x=>(i?'td':'th')+'>'+x+'</'+(i?'td':'th')+'>').join('')+'</tr>').join('')+'</table>';
function ticker(){document.querySelector('#ticker').innerHTML=Object.values(I).map(x=>'<div><strong>'+x[0]+'</strong> '+fmt(x[1])+' <span class="up">+0.42%</span></div>').join('')+'<div><strong>INDIA VIX</strong> 13.8</div>'}
function signal(){return '<div class="mu">'+I[cur][0]+' · PCR 1.02 · Data fresh</div><div class="sig up">CALL BUY</div><div class="meter"><i style="width:82%"></i></div>'+['L1 Data Feed','L2 Features','L3 Signal Model','L4 Regime/VIX','L5 Risk Gate','L6 OI + Order Flow'].map(x=>'<div class="row"><span>'+x+'</span><b class="pill">AGREES</b></div>').join('')}
function chart(){return '<svg class="chart" viewBox="0 0 600 155" preserveAspectRatio="none"><defs><linearGradient id="g"><stop stop-color="#ff9f1a"/><stop offset="1" stop-color="#2ee66b"/></linearGradient></defs><polyline fill="none" stroke="url(#g)" stroke-width="3" points="0,125 50,112 100,120 150,82 200,95 250,65 300,78 350,43 400,58 450,35 500,48 550,22 600,38"/></svg>'}
function bars(){return '<div class="bars">'+Array.from({length:18},(_,i)=>'<i style="height:'+(25+Math.random()*75)+'%"></i>').join('')+'</div>'}
function screen(i){const u=I[cur],atm=Math.round(u[1]/u[2])*u[2];
if(i===0)return sec('NSE-AI-TERMINAL','<div style="text-align:center;padding:32px 8px"><div class="am" style="font-size:32px;font-weight:900">NSE-AI-TERMINAL</div><p class="mu">Smart Analysis · Disciplined Execution · AI Powered</p><button class="theme" onclick="go(1)">GET STARTED</button><p class="mu">Paper / Demo Mode · Live Orders Off</p></div>');
if(i===1)return sec('ANGEL ONE LOGIN','<input class="cmd" placeholder="Client ID"><input class="cmd" placeholder="PIN"><input class="cmd" placeholder="TOTP"><button class="theme" onclick="go(2)">LOGIN</button> <button class="theme" onclick="go(2)">DEMO</button><p class="mu">Credentials are sent to the server only.</p>','c6');
if(i===2)return sec('INDICES',Object.keys(I).map(k=>'<div class="row"><b>'+I[k][0]+'</b><span>'+fmt(I[k][1])+' <span class="up">+0.42%</span></span></div>').join(''),'c4')+sec("TODAY'S SIGNAL",signal(),'c4')+sec('REGIME','<div class="row"><span>Regime</span><b class="up">Bullish</b></div><div class="row"><span>Trend</span><b class="up">Uptrend</b></div><div class="row"><span>Volatility</span><b>Low</b></div><div class="row"><span>Momentum</span><b class="up">Strong</b></div>','c4')+sec(u[0]+' · 1m',chart(),'c8')+sec('PORTFOLIO',rows([['Symbol','Qty','LTP','P&L'],['NIFTY','75',fmt(u[1]),'<span class="up">+2.3%</span>'],['BANKNIFTY','50','52317','<span class="up">+1.8%</span>'],['FINNIFTY','50','23482','<span class="up">+1.2%</span>']]),'c4');
if(i===3)return sec('MARKET',rows([['Index','LTP','Chg%'],...Object.values(I).map(x=>[x[0],fmt(x[1]),'<span class="up">+0.42%</span>'])]),'c6')+sec('TOP MOVERS',rows([['Stock','LTP','Chg%'],['RELIANCE','2918.4','+1.2%'],['HDFCBANK','1642.1','+0.8%'],['INFY','1512.6','-1.1%'],['TCS','3980.0','-0.6%'],['SBIN','812.3','+1.9%']]),'c6');
if(i===4){let r=[];for(let x=-4;x<=4;x++){let k=atm+x*u[2];r.push(['<span class="dn">'+fmt(40+x*2)+'</span>',fmt(Math.max(5,20-x*2)),k,fmt(Math.max(5,20+x*2)),'<span class="up">'+fmt(45-x*2)+'</span>'])}return sec(u[0]+' OPTION CHAIN',rows([['CE OI(L)','CE LTP','STRIKE','PE LTP','PE OI(L)'],...r]));}
if(i===5)return sec('OI HEATMAP · CE vs PE',bars()+'<p class="mu">CE = red · PE = green · ATM = amber</p>');
if(i===6)return sec('CE-PE PREMIUM SPREAD',chart(),'c6')+sec('VOLUME BY STRIKE',bars(),'c6');
if(i===7)return sec('GREEKS / IV',rows([['Strike','Delta','Gamma','Theta','Vega','IV%'],[atm-100,'.72','.004','-8.4','11.2','14.3'],[atm,'.50','.006','-9.0','12.0','13.5'],[atm+100,'.28','.004','-8.4','11.2','14.3']]),'c8')+sec('IV SKEW',bars(),'c4');
if(i===8)return sec('NET FLOW','<div class="metric"><small>NET FLOW</small><strong class="up">+12.4K</strong></div><div class="metric"><small>BUY RATIO</small><strong>68%</strong></div>','c4')+sec('BUY vs SELL',bars(),'c8');
if(i===9)return sec('MARKET REGIME','<div class="row"><span>Regime</span><b class="up">Bullish</b></div><div class="row"><span>Trend</span><b class="up">Uptrend</b></div><div class="row"><span>Volatility</span><b>Low</b></div>','c6')+sec('ENGINE LOGIC','<div class="row"><span>VIX</span><b>13.8</b></div><div class="row"><span>ADX</span><b>24.1</b></div><div class="row"><span>Breadth</span><b>1.6</b></div>','c6');
if(i===10)return sec('QUALIFYING TRADE PLANS',rows([['Side','Strike','Entry','SL','T1','T2','RR'],['CALL',atm,'18.40','16.90','20.20','22.10','1:1.4'],['CALL',atm+u[2],'14.20','13.00','15.60','17.00','1:1.5'],['PUT',atm-u[2],'13.80','12.60','15.20','16.50','1:1.3']]));
if(i===11)return sec('BACKTEST PERFORMANCE','<div class="grid2"><div class="metric"><small>WIN RATE</small><strong class="up">62.4%</strong></div><div class="metric"><small>AVG R</small><strong>1.8</strong></div><div class="metric"><small>MAX DD</small><strong class="dn">12.3%</strong></div><div class="metric"><small>TRADES</small><strong>412</strong></div></div>','c4')+sec('EQUITY CURVE',chart(),'c8');
if(i===12)return sec('STRATEGY REGISTRY · 377 MODULES','<input class="cmd" placeholder="Search strategies...">'+rows([['ID','Strategy','Win%','Avg R'],['S001','OI Wall v1','52%','1.2'],['S002','Long Buildup v1','59%','1.5'],['S003','Short Covering v1','66%','1.8'],['S004','VWAP Reclaim v1','63%','1.6'],['S005','ORB v1','61%','1.7']]));
if(i===13)return sec('6-LAYER AI VALIDATION',['GPT-5.6 Luna','Claude Sonnet 4.6','GPT-5.6 Sol','DeepSeek Chat','Gemini 2.5 Flash','Grok 4'].map((x,j)=>'<div class="row"><span>L'+(j+1)+' '+x+'</span><b class="pill">AGREES</b></div>').join('')+'<div class="row"><span>FINAL</span><b class="up">CALL BUY</b></div>');
const titles=['Logs / Settings','Portfolio','Charts','Strategy Detail','Risk','Alerts','Help','Watchlist','Orders','Signal History','Scanner','FII / DII','News','Alert Rules','Journal','Broker / API'];
return sec(titles[i-14]||tabs[i],'<div class="row"><span>Data source</span><b>Angel One SmartAPI</b></div><div class="row"><span>Mode</span><b class="am">PAPER</b></div><div class="row"><span>Live Orders</span><b class="dn">OFF</b></div><div class="row"><span>Server</span><b>FastAPI · WebSocket</b></div><div class="row"><span>Status</span><b class="up">READY</b></div>');
}
function nav(){tabs.forEach((x,i)=>{});document.querySelector('#tabs').innerHTML=tabs.map((x,i)=>'<button class="'+(i===active?'active':'')+'" onclick="go('+i+')">'+(i+1)+'. '+x+'</button>').join('')}
function go(i){active=i;nav();document.querySelector('#app').innerHTML=screen(i);document.querySelectorAll('#tabs button')[i]?.scrollIntoView({inline:'center'})}
function drawer(on){let d=document.querySelector('#drawer');d.innerHTML='<div class="drawerHead"><span>PRO MODE · 30 TABS</span><button class="close" onclick="drawer(false)">✕</button></div><div class="drawerSub">NSE-AI-TERMINAL · '+tabs.length+' modules</div><div class="dg">'+tabs.map((x,i)=>'<button class="'+(i===active?'active':'')+'" onclick="go('+i+');drawer(false)"><span class="num">'+String(i+1).padStart(2,'0')+'</span><span>'+x+'</span></button>').join('')+'</div>';d.classList.toggle('open',on);document.querySelector('#overlay').classList.toggle('open',on)}
document.querySelector('#menu').onclick=()=>drawer(true);document.querySelector('#overlay').onclick=()=>drawer(false);document.querySelector('#theme').onclick=()=>document.body.classList.toggle('light');
document.querySelector('#cmd').onkeydown=e=>{if(e.key!=='Enter')return;let v=e.target.value.trim().toUpperCase().replace(/\s/g,'');e.target.value='';if(I[v]){cur=v;go(active)}else if(+v>=1&&+v<=30)go(+v-1)};
setInterval(()=>document.querySelector('#clock').textContent=new Date().toLocaleTimeString('en-IN')+' IST',1000);ticker();nav();go(2);
</script>
</body></html>
